name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar o deploy manualmente pela aba Actions.
  workflow_dispatch:

# Permissões mínimas para publicar no Pages com o token do próprio job.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. Um push novo durante um deploy em andamento
# espera o atual terminar em vez de cancelá-lo pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # O build já roda `tsc -b` antes do Vite: erro de tipo derruba
      # o deploy em vez de publicar uma versão quebrada.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
